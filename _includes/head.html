<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
<link rel="icon" href="{{ '/assets/favicon.png' | relative_url }}" type="image/png">
<meta property="og:title" content="{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_newlines }}">
<meta property="og:type" content="website">
<meta property="og:image" content="{{ site.url }}/assets/images/hero-night-laptop.jpg">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
{% if site.ga4_id and site.ga4_id != "" %}
<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.ga4_id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site.ga4_id }}');
</script>
{% endif %}
<!-- 構造化データ: Organization（sameAs で各チャネルを接続する。戦略文書 A9） -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "{{ site.title }}",
  "slogan": "{{ site.tagline }}",
  "description": "{{ site.description | strip_newlines | escape }}",
  "sameAs": [
    "{{ site.channels.note }}",
    "{{ site.channels.x }}",
    "{{ site.channels.zenn }}",
    "{{ site.channels.youtube }}",
    "{{ site.channels.booth }}",
    "{{ site.channels.suzuri }}"
  ]
}
</script>
{% if page.layout == "post" %}
<!-- 構造化データ: Article（記事ページのみ。FAQPage は任意のため付けない） -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{ page.title | escape }}",
  "datePublished": "{{ page.date | date_to_xmlschema }}"{% if page.updated %},
  "dateModified": "{{ page.updated | date_to_xmlschema }}"{% endif %},
  "author": { "@type": "Organization", "name": "{{ site.author }}" },
  "publisher": { "@type": "Organization", "name": "{{ site.title }}" }
}
</script>
{% endif %}
